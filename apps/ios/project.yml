name: Signet
options:
  bundleIdPrefix: app.signet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Signet:
    type: application
    platform: iOS
    sources:
      - path: Signet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.signet.owner
        INFOPLIST_KEY_CFBundleDisplayName: Signet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Нужен доступ к фото для аватара визитки"
        INFOPLIST_KEY_NSCameraUsageDescription: "Нужна камера для фото визитки"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        # Injected into Info.plist for AppConfig (quote $() for YAML)
        INFOPLIST_KEY_API_BASE_URL: "$(API_BASE_URL)"
        INFOPLIST_KEY_PUBLIC_WEB_BASE_URL: "$(PUBLIC_WEB_BASE_URL)"
        INFOPLIST_KEY_NSAllowsLocalNetworking: YES

