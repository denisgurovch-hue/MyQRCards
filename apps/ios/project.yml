name: Signet
options:
  bundleIdPrefix: app.signet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  Signet:
    type: application
    platform: iOS
    sources:
      - path: Signet
        excludes:
          - Info.plist
          - Info-Additions.plist
    info:
      path: Signet/Info.plist
      properties:
        API_BASE_URL: "$(API_BASE_URL)"
        PUBLIC_WEB_BASE_URL: "$(PUBLIC_WEB_BASE_URL)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.signet.owner
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        INFOPLIST_FILE: Signet/Info.plist
        GENERATE_INFOPLIST_FILE: NO
