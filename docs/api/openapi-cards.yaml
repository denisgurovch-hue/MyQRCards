openapi: 3.0.3
info:
  title: MyQRCards Cards API
  version: 0.1.0
  description: Owner card management (T-003)
servers:
  - url: http://localhost:3001/api/v1
paths:
  /cards:
    get:
      summary: List current user cards
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paginated card list
        '401':
          description: Unauthorized
    post:
      summary: Create card
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardRequest'
      responses:
        '201':
          description: Created
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Slug already exists
  /cards/{id}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      summary: Get owned card
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Card
        '401':
          description: Unauthorized
        '404':
          description: Not found
    patch:
      summary: Update owned card
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCardRequest'
      responses:
        '200':
          description: Updated
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Slug already exists
    delete:
      summary: Soft-delete owned card
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /cards/{id}/publish:
    post:
      summary: Publish card
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '201':
          description: Published
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /cards/{id}/unpublish:
    post:
      summary: Unpublish card (back to draft)
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '201':
          description: Unpublished
        '401':
          description: Unauthorized
        '404':
          description: Not found
  /cards/{id}/archive:
    post:
      summary: Archive card
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CardId'
      responses:
        '201':
          description: Archived
        '401':
          description: Unauthorized
        '404':
          description: Not found
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: mq_access
  parameters:
    CardId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CardLink:
      type: object
      required: [url]
      properties:
        label: { type: string }
        url: { type: string, format: uri }
        type: { type: string }
        position: { type: integer, minimum: 0 }
    CreateCardRequest:
      type: object
      required: [displayName]
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        jobTitle: { type: string }
        companyName: { type: string }
        summary: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        showEmail: { type: boolean }
        websiteUrl: { type: string, format: uri }
        photoUrl: { type: string, format: uri }
        slug: { type: string, minLength: 6, maxLength: 32, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CardLink'
    UpdateCardRequest:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 120 }
        jobTitle: { type: string, nullable: true }
        companyName: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        showEmail: { type: boolean }
        websiteUrl: { type: string, format: uri, nullable: true }
        photoUrl: { type: string, format: uri, nullable: true }
        slug: { type: string, minLength: 6, maxLength: 32, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        links:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CardLink'
