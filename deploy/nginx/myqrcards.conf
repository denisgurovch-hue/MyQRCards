# Install on VPS as /etc/nginx/sites-available/myqrcards
# Then: ln -s /etc/nginx/sites-available/myqrcards /etc/nginx/sites-enabled/
# Replace DOMAIN with the public apex hostname before first certbot run
# (provision-vps.sh does: sed "s/DOMAIN/${DOMAIN}/g").
#
# Canonical host: https://DOMAIN (apex). www and plain HTTP always 301 there.
# Issue cert for both names:
#   sudo certbot --nginx -d DOMAIN -d www.DOMAIN
#
# Traffic:
#   /          → web:3000
#   /api/v1/   → api:3001
#   /readyz    → api:3001 (readiness)

upstream myqrcards_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream myqrcards_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP → HTTPS apex (preserve path; do not keep www via $host)
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://DOMAIN$request_uri;
    }
}

# HTTPS www → HTTPS apex (single canonical host for crawlers / robots.txt)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.DOMAIN;

    # Managed by Certbot (paths after `certbot --nginx` or fill manually).
    # Cert must include www.DOMAIN (SAN); live dir is usually the apex name:
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://DOMAIN$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # Managed by Certbot (paths after `certbot --nginx` or fill manually):
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Card photo uploads are capped at 5 MB on the API; keep nginx slightly above.
    client_max_body_size 6m;

    # Prefer route templates over raw $request_uri in access logs when
    # tightening slug disclosure (see security audit). Default combined log
    # still includes full URI until operators switch log_format.

    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://myqrcards_api;
    }

    location = /readyz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://myqrcards_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://myqrcards_web;
    }
}
