# Install on VPS as /etc/nginx/sites-available/myqrcards
# Then: ln -s /etc/nginx/sites-available/myqrcards /etc/nginx/sites-enabled/
# Replace DOMAIN with the public hostname before first certbot run.
#
# Traffic:
#   /          → web:3000
#   /api/v1/   → api:3001
#   /readyz    → api:3001 (readiness)
#
# iOS / Safari notes:
# - Do NOT hardcode `Connection "upgrade"` on ordinary page traffic.
#   That breaks upstream keepalive and has caused flaky mobile loads.
# - Prefer HTTP/2 on 443; keep proxy to Next on HTTP/1.1 + keepalive.
# - Hide hop-by-hop Upgrade from the client response (Safari is strict).

upstream myqrcards_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream myqrcards_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name DOMAIN;

    client_max_body_size 6m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # Managed by Certbot (paths after `certbot --nginx` or fill manually):
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling (reduces Safari/mobile stalls waiting on CA AIA/OCSP).
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/DOMAIN/chain.pem;
    # resolver 1.1.1.1 8.8.8.8 valid=300s;
    # resolver_timeout 5s;

    # After HTTPS is confirmed working:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Card photo uploads are capped at 5 MB on the API; keep nginx slightly above.
    client_max_body_size 6m;

    # Prefer route templates over raw $request_uri in access logs when
    # tightening slug disclosure (see security audit). Default combined log
    # still includes full URI until operators switch log_format.

    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://myqrcards_api;
    }

    location = /readyz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_pass http://myqrcards_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keepalive to Next; no websocket upgrade on the public site.
        proxy_set_header Connection "";
        proxy_hide_header Upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_pass http://myqrcards_web;
    }
}
