# Install on VPS as /etc/nginx/sites-available/myqrcards
# Then: ln -s /etc/nginx/sites-available/myqrcards /etc/nginx/sites-enabled/
# Replace DOMAIN with the public hostname before first certbot run.
#
# Traffic:
#   /          → web:3000
#   /api/v1/   → api:3001
#   /readyz    → api:3001 (readiness)

upstream myqrcards_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream myqrcards_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    # Managed by Certbot (paths after `certbot --nginx` or fill manually):
    # ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Card photo uploads are capped at 5 MB on the API; keep nginx slightly above.
    client_max_body_size 6m;

    location /api/v1/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://myqrcards_api;
    }

    location = /readyz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://myqrcards_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://myqrcards_web;
    }
}
